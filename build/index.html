<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NZ Goth List</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0a;
      --surface: #141414;
      --text: #e8e8e8;
      --muted: #888;
      --accent: #7b2cbf;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    main {
      max-width: 40rem;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .badge {
      display: inline-block;
      background: var(--surface);
      border: 1px solid #333;
      border-radius: 999px;
      padding: 0.35rem 1rem;
      font-size: 0.875rem;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>NZ Goth List</h1>
    <p>A directory of goth culture, events, and communities across New Zealand.</p>
    <span class="badge">Coming soon</span>
  </main>
</body>
</html>
